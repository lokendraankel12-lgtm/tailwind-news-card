<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Card Activity</title>
    <!-- Agar tu CSS file link kar raha hai -->
   <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-800 flex items-center justify-center min-h-screen">

    <!-- Main Card Container -->
    <div class="bg-white w-[600px] rounded-xl shadow-2xl overflow-hidden border border-gray-200">
        
        <!-- Top Purple Banner Section -->
        <div class="bg-indigo-600 py-10 px-6 text-center">
            <h2 class="text-white text-2xl font-bold">News you can Trust.</h2>
        </div>

        <!-- Bottom Content Section -->
        <div class="p-8 text-center">
            <h3 class="text-xl font-bold text-gray-900 mb-2">Stay up to date with the Latest!</h3>
            <p class="text-gray-500 text-sm mb-6">Subscribe to our newsletter for the latest news straight into your inbox</p>

            <!-- Input and Button Form -->
            <div class="space-y-4 max-w-md mx-auto">
                <input 
                    type="email" 
                    placeholder="you@example.com" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center"
                >
                <button 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg shadow-md transition duration-200">
                    Subscribe Now
                </button>
            </div>

            <!-- Footer Small Text -->
            <p class="text-xs text-gray-400 mt-6">We value your privacy</p>
        </div>

    </div>

</body>
</html>
